<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pitch Lab</title>
<meta name="description" content="Ear-training games: name notes, hear intervals, sharpen your ear, and sing in tune.">
<meta name="theme-color" content="#0f1222">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1222; --panel:#181c33; --panel2:#20264a; --line:#2d3563;
  --text:#eef0ff; --muted:#9aa2d6; --accent:#7c5cff; --accent2:#22d3ee;
  --good:#34d399; --bad:#fb7185; --warn:#fbbf24;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 50% -200px,#2a2470 0%,var(--bg) 60%) fixed,var(--bg);
  color:var(--text);font-family:"Space Grotesk",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:16px;min-height:44px}
.logo{font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.spacer{flex:1}
.back,.logo,#whoChip{white-space:nowrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}
.back{font-size:15px;padding:8px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:20px;margin:0 0 10px}
p.sub{color:var(--muted);margin:0 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;
  background:var(--accent);font-weight:700;font-size:16px;min-height:48px;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);font-weight:500}
.btn.big{font-size:18px;padding:16px 22px;min-height:58px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.hidden{display:none!important}

/* players */
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.pcard{padding:18px;border-radius:var(--radius);background:var(--panel);border:2px solid var(--line);text-align:left;transition:border-color .15s,transform .08s}
.pcard:active{transform:scale(.98)}
.pcard .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:22px;margin-bottom:10px;color:#0f1222}
.pcard .nm{font-size:20px;font-weight:700}
.pcard .pts{color:var(--muted);font-size:14px}
.pcard.add{border-style:dashed;display:grid;place-items:center;color:var(--muted);text-align:center}

/* game cards */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.gcard{text-align:left;padding:18px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .08s,border-color .15s}
.gcard:hover{border-color:var(--accent)}
.gcard:active{transform:scale(.98)}
.gcard .ic{font-size:30px}
.gcard .t{font-size:19px;font-weight:700;margin:6px 0 2px}
.gcard .d{color:var(--muted);font-size:14px}
.gcard .stat{margin-top:12px;font-size:13px;color:var(--accent2);font-weight:500}
.gcard .tag{position:absolute;top:14px;right:14px;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px}
.stat small{color:var(--muted);font-size:12px}

/* game screen */
.hud{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stage{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px 12px}
.bigplay{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:42px;box-shadow:0 10px 40px -10px var(--accent)}
.bigplay:active{transform:scale(.95)}
.bigplay.pulse{animation:pulse 1s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,92,255,.7)}100%{box-shadow:0 0 0 30px rgba(124,92,255,0)}}
.feedback{min-height:56px;font-size:18px;font-weight:500}
.feedback .good{color:var(--good)}
.feedback .bad{color:var(--bad)}
.hint{color:var(--muted);font-size:14px}

/* piano */
.piano{position:relative;height:190px;margin:8px auto 0;max-width:560px;user-select:none;touch-action:manipulation}
.wk,.bk{position:absolute;bottom:0;border-radius:0 0 10px 10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-weight:700;transition:background .12s,transform .05s}
.wk{top:0;background:#f4f5ff;color:#20264a;border:1px solid #c7cbe8;font-size:17px}
.bk{top:0;height:60%;background:#232847;color:#eef0ff;z-index:2;border:1px solid #0b0d1a;font-size:13px;box-shadow:0 4px 8px rgba(0,0,0,.4)}
.wk:active:not(.locked),.bk:active:not(.locked){transform:translateY(2px)}
.wk.locked{background:#9aa0c4;color:#6b7199}
.bk.locked{background:#4a4f70;color:#7c82a8}
.wk.locked::after,.bk.locked::after{content:"🔒";position:absolute;top:8px;left:0;right:0;text-align:center;font-size:12px;opacity:.6}
.wk.right,.bk.right{background:var(--good)!important;color:#05261b!important}
.wk.wrong,.bk.wrong{background:var(--bad)!important;color:#3b0711!important}
.wk.new,.bk.new{box-shadow:inset 0 0 0 3px var(--warn)}

/* answer grid (intervals) */
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.ans{padding:14px 10px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-weight:500;min-height:56px;font-size:15px}
.ans small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.ans.right{background:var(--good);color:#05261b}
.ans.right small{color:#05261b}
.ans.wrong{background:var(--bad);color:#3b0711}
.ans.wrong small{color:#3b0711}

/* progress */
.bar{height:10px;border-radius:999px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .3s}
.unlock-box{margin-top:14px}
.unlock-box .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}

/* hl buttons */
.hl{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:460px}
.hl .btn{min-height:84px;font-size:20px}

/* tuner */
.tuner{width:100%;max-width:520px;margin:0 auto}
.tnote{font-size:64px;font-weight:700;line-height:1;letter-spacing:-.03em}
.tnote small{font-size:20px;color:var(--muted);font-weight:500}
.meter{position:relative;height:58px;margin:18px 0 6px;border-radius:14px;background:linear-gradient(90deg,#3b1730 0%,#3b3417 30%,#123b2a 42%,#123b2a 58%,#3b3417 70%,#3b1730 100%);border:1px solid var(--line);overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;left:37.5%;width:25%;border-left:2px dashed rgba(52,211,153,.5);border-right:2px dashed rgba(52,211,153,.5)}
.meter .mid{position:absolute;top:0;bottom:0;left:50%;width:2px;background:rgba(255,255,255,.5)}
.needle{position:absolute;top:6px;bottom:6px;width:8px;margin-left:-4px;border-radius:4px;background:#fff;left:50%;transition:left .08s linear,opacity .2s;box-shadow:0 0 12px #fff}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.dir{font-size:20px;font-weight:700;min-height:30px;margin-top:8px}
.stars{font-size:30px;letter-spacing:4px}
input[type=range]{width:100%;max-width:460px;accent-color:var(--accent);height:36px}
.nudge{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.nudge .btn{min-width:64px;padding:10px 12px}
.tappad{width:100%;max-width:460px;height:170px;border-radius:24px;background:var(--panel2);border:2px solid var(--line);font-size:26px;font-weight:700;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:background .06s,border-color .2s}
.tappad.armed{border-color:var(--accent2)}
.tappad.hit{background:var(--accent)}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
.dots i.on{background:var(--accent2);border-color:var(--accent2)}

/* toggles */
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:8px 12px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}

/* modal / toast */
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%) translateY(-120%);background:var(--panel2);border:1px solid var(--warn);color:var(--text);padding:14px 20px;border-radius:14px;font-weight:700;z-index:50;transition:transform .35s;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.modalbg{position:fixed;inset:0;background:rgba(5,6,15,.7);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;width:100%;max-width:380px}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-size:17px;margin:10px 0 14px}

.board{width:100%;border-collapse:collapse;font-size:15px}
.board td,.board th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
.board th{color:var(--muted);font-weight:500;font-size:13px}
.board td.n{text-align:right;font-variant-numeric:tabular-nums}
.tips li{margin-bottom:8px;color:var(--muted)}
.tips b{color:var(--text)}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}
.footer{margin-top:28px;text-align:center;color:var(--muted);font-size:13px}
@media (max-width:420px){
  h1{font-size:24px}
  .logo{font-size:18px}
  .back{padding:8px 10px;font-size:14px}
  #whoChip{font-size:13px;padding:6px 10px}
  header.top{gap:8px}
  .piano{height:170px}
  .wk{font-size:15px}
  .bk{font-size:11px}
  .tnote{font-size:54px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="back hidden" id="backBtn">← Back</button>
    <div class="logo" id="logo">🎧 <span>Pitch Lab</span></div>
    <div class="spacer"></div>
    <button class="chip hidden" id="whoChip"></button>
  </header>
  <main id="app"></main>
  <div class="footer">Pitch Lab · headphones recommended · progress is saved on this device</div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= Music data ================= */
const PC_NAMES = ["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
const PC_LONG  = ["C","C♯ / D♭","D","E♭ / D♯","E","F","F♯ / G♭","G","A♭ / G♯","A","B♭ / A♯","B"];
// Order new notes are unlocked in (spread out so neighbours aren't introduced together)
const NOTE_ORDER = [0,7,4,9,2,5,11,6,10,3,1,8];
const INTERVALS = [
  {st:7,  name:"Perfect 5th", short:"P5", song:"Star Wars theme / Twinkle Twinkle (\"twin-kle → lit-tle\")"},
  {st:12, name:"Octave",      short:"P8", song:"Somewhere Over the Rainbow (\"Some-where\")"},
  {st:4,  name:"Major 3rd",   short:"M3", song:"When the Saints Go Marching In (\"Oh, when\")"},
  {st:5,  name:"Perfect 4th", short:"P4", song:"Here Comes the Bride / Amazing Grace (\"A-maz\")"},
  {st:3,  name:"Minor 3rd",   short:"m3", song:"Smoke on the Water (first two notes) / Greensleeves"},
  {st:2,  name:"Major 2nd",   short:"M2", song:"Happy Birthday (\"Hap-py → birth\") / a major scale"},
  {st:9,  name:"Major 6th",   short:"M6", song:"My Bonnie Lies Over the Ocean (\"My Bon\")"},
  {st:10, name:"Minor 7th",   short:"m7", song:"Star Trek original theme (first two notes)"},
  {st:1,  name:"Minor 2nd",   short:"m2", song:"Jaws theme (dun-dun)"},
  {st:11, name:"Major 7th",   short:"M7", song:"Take On Me chorus (\"Take → on\")"},
  {st:8,  name:"Minor 6th",   short:"m6", song:"The Entertainer (high notes at the start)"},
  {st:6,  name:"Tritone",     short:"TT", song:"The Simpsons theme (\"The Simp\") / Maria"},
];
const midiToFreq = m => 440 * Math.pow(2, (m - 69) / 12);
const freqToMidi = f => 69 + 12 * Math.log2(f / 440);
const noteLabel = m => PC_NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };

/* ================= Audio ================= */
let ctx = null, master = null;
function audio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.ratio.value = 4;
    master = ctx.createGain(); master.gain.value = 0.9;
    master.connect(comp); comp.connect(ctx.destination);
  }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}
// Piano-like tone made of decaying harmonics
function playFreq(f, { when = 0, dur = 1.5, vol = 0.32, pure = false } = {}) {
  const c = audio(); const t0 = c.currentTime + 0.02 + when;
  const harm = pure ? [1, 0.25, 0.08] : [1, 0.55, 0.32, 0.18, 0.11, 0.07, 0.04];
  harm.forEach((h, i) => {
    const n = i + 1; const hf = f * n * (pure ? 1 : (1 + 0.0004 * n * n)); // slight piano inharmonicity
    if (hf > 9000) return;
    const o = c.createOscillator(); const g = c.createGain();
    o.type = "sine"; o.frequency.value = hf;
    const peak = vol * h; const d = pure ? dur : dur / (1 + i * 0.6);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + 0.008);
    if (pure) { g.gain.setValueAtTime(peak, t0 + d - 0.06); g.gain.linearRampToValueAtTime(0, t0 + d); }
    else g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  });
  return (when + dur) * 1000;
}
const playMidi = (m, opts) => playFreq(midiToFreq(m), opts);
// "Scrambler": a burst of random notes that wipes out the memory of the last pitch,
// so you have to recognise the new note on its own instead of comparing.
function scramble() {
  for (let i = 0; i < 7; i++) playMidi(randInt(40, 90) + Math.random(), { when: i * 0.05, dur: 0.18, vol: 0.12 });
  return 7 * 50 + 250;
}

/* ================= Storage ================= */
const KEY = "pitchlab.v1";
const COLORS = ["#7c5cff", "#22d3ee", "#34d399", "#fbbf24", "#fb7185", "#a78bfa"];
function newProfile(name, i) {
  return { name, color: COLORS[i % COLORS.length], points: 0, days: [], streak: 0, lastDay: null,
    note: { unlocked: 3, recent: [], since: 0, per: {}, total: 0, right: 0, octave: "auto", scramble: true },
    interval: { unlocked: 3, recent: [], since: 0, per: {}, total: 0, right: 0, dir: "auto" },
    ear: { best: null, last: null, sessions: 0 },
    sing: { voice: "mid", rounds: 0, stars: 0, best: 0 },
    tempo: newTempo() };
}
function newTempo() { return { mode: "guess", guessRounds: 0, guessBest: 0, tapRounds: 0, tapBest: 0 }; }
let store;
function load() {
  try { store = JSON.parse(localStorage.getItem(KEY)); } catch (e) { store = null; }
  if (!store || !store.players) {
    store = { players: {}, current: null };
    ["Reece", "Brian"].forEach((n, i) => store.players[n] = newProfile(n, i));
  }
  Object.values(store.players).forEach(p => { if (!p.tempo) p.tempo = newTempo(); }); // older saves
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const me = () => store.players[store.current];
function addPoints(n) {
  const p = me(); p.points += n;
  const t = todayStr();
  if (p.lastDay !== t) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    const ys = y.getFullYear() + "-" + String(y.getMonth()+1).padStart(2,"0") + "-" + String(y.getDate()).padStart(2,"0");
    p.streak = (p.lastDay === ys) ? p.streak + 1 : 1;
    p.lastDay = t;
    if (!p.days.includes(t)) p.days.push(t);
    if (p.days.length > 400) p.days.shift();
  }
  save(); updateChip();
}

/* ================= UI helpers ================= */
const $app = document.getElementById("app");
const $back = document.getElementById("backBtn");
const $chip = document.getElementById("whoChip");
let cleanup = null;
function h(html) { $app.innerHTML = html; window.scrollTo(0, 0); }
function toast(msg, ms = 2600) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms);
}
function updateChip() {
  const p = store.current && me();
  if (!p) { $chip.classList.add("hidden"); return; }
  $chip.classList.remove("hidden");
  $chip.innerHTML = `<b style="color:${p.color}">${esc(p.name)}</b> · ${p.points} pts${p.streak > 1 ? " · 🔥" + p.streak : ""}`;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function go(screen, ...args) {
  if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
  document.onkeydown = null;
  $back.classList.toggle("hidden", screen === screens.players);
  $back.onclick = () => go(screen === screens.home ? screens.players : screens.home);
  screen(...args);
}
document.getElementById("logo").onclick = () => go(store.current ? screens.home : screens.players);
$chip.onclick = () => go(screens.players);

/* ================= Screens ================= */
const screens = {};

screens.players = function () {
  store.current = null; save(); updateChip();
  const list = Object.values(store.players);
  h(`
    <h1>Who's training?</h1>
    <p class="sub">Each player has their own progress, points and streak.</p>
    <div class="players">
      ${list.map(p => `
        <button class="pcard" data-name="${esc(p.name)}">
          <div class="av" style="background:${p.color}">${esc(p.name[0].toUpperCase())}</div>
          <div class="nm">${esc(p.name)}</div>
          <div class="pts">${p.points} pts${p.streak > 1 ? " · 🔥 " + p.streak + "-day streak" : ""}</div>
        </button>`).join("")}
      <button class="pcard add" id="addP"><div><div style="font-size:30px">＋</div>Add player</div></button>
    </div>
    ${list.length > 1 ? leaderboard(list) : ""}
    <div class="panel" style="margin-top:12px">
      <h2>How Pitch Lab works</h2>
      <ul class="tips">
        <li><b>Note Detective</b> trains <i>absolute pitch</i>: recognising a note (like "that's a G") with no reference. You start with 3 notes and unlock more as you get them right.</li>
        <li><b>Interval Hunter</b> trains <i>relative pitch</i>: hearing the distance between two notes. This is the skill musicians use most, and anyone can get very good at it.</li>
        <li><b>Sharp Ears</b> measures how small a pitch difference you can hear, in cents (100 cents = one piano key).</li>
        <li><b>Tempo Sense</b> trains your inner clock: guess how fast a beat is in BPM (beats per minute), or tap a tempo from memory.</li>
        <li><b>Sing It</b> (optional, uses the mic) shows live whether your voice is on the note, too high or too low.</li>
        <li><b>10 minutes a day beats an hour once a week.</b> Keep your streak going.</li>
      </ul>
    </div>`);

function isYesterday(d) {

/* ---------- shared mastery logic ---------- */
const WINDOW = 20, NEED = 0.85;
function recordAnswer(mod, key, ok) {
  mod.recent.push(ok ? 1 : 0); if (mod.recent.length > WINDOW) mod.recent.shift();
  mod.since++; mod.total++; if (ok) mod.right++;
  const s = mod.per[key] || (mod.per[key] = { t: 0, r: 0 }); s.t++; if (ok) s.r++;
}
function canUnlock(mod) {
  if (mod.unlocked >= 12 || mod.since < WINDOW) return false;
  const acc = mod.recent.reduce((a, b) => a + b, 0) / mod.recent.length;
  return acc >= NEED;
}
function progressHTML(mod, label) {
  const n = mod.recent.length; const acc = n ? mod.recent.reduce((a, b) => a + b, 0) / n : 0;
  if (mod.unlocked >= 12) return `<div class="unlock-box"><div class="lbl"><span>All 12 ${label} unlocked 🎉</span><span>last ${n}: ${Math.round(acc * 100)}%</span></div><div class="bar"><i style="width:${acc * 100}%"></i></div></div>`;
  const need = Math.max(0, WINDOW - mod.since);
  return `<div class="unlock-box"><div class="lbl"><span>${need > 0 ? `Next unlock: ${need} more answers at 85%+` : `Get 85% on your last ${WINDOW} to unlock the next one`}</span>
    <span>${n ? Math.round(acc * 100) + "%" : ""}</span></div><div class="bar"><i style="width:${Math.min(100, acc / NEED * 100)}%"></i></div></div>`;
}
// Weighted pick: favour weak and newly added items
function weightedPick(keys, mod, newest) {
  const w = keys.map(k => { const s = mod.per[k]; const acc = s && s.t ? s.r / s.t : 0.5; return 1 + (1 - acc) * 2 + (k === newest ? 1.5 : 0); });
  let r = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < keys.length; i++) { r -= w[i]; if (r <= 0) return keys[i]; }
  return keys[keys.length - 1];
}

/* ---------- Note Detective ---------- */
screens.note = function () {
  const p = me(); const N = p.note;
  let cur = null, answered = false, streak = 0, busy = false;
  const unlocked = () => NOTE_ORDER.slice(0, N.unlocked);
  h(`
    <h1>🕵️ Note Detective</h1>
    <p class="sub">Listen, then tap the note you think it is. Think about how each note <i>feels</i>, not how it compares to the last one.</p>

      <div class="seg" id="scrSeg" title="Play a scramble before each note so you can't just compare">

    </div>

      <div class="stage">
        <button class="bigplay" id="play" aria-label="Play note">▶</button>

  const $piano = document.getElementById("piano");

  const $after = document.getElementById("after");
  const $play = document.getElementById("play");

  function buildPiano() {
    const whites = [0, 2, 4, 5, 7, 9, 11], blacks = { 1: 0, 3: 1, 6: 3, 8: 4, 10: 5 };
    const u = unlocked(); const newest = NOTE_ORDER[N.unlocked - 1];

    Object.entries(blacks).forEach(([pc, i]) => { pc = +pc; html += `<button class="bk${u.includes(pc) ? "" : " locked"}${pc === newest && N.unlocked > 3 ? " new" : ""}" data-pc="${pc}" style="left:${(i + 1) * w - w * 0.32}%;width:${w * 0.64}%">${u.includes(pc) ? PC_NAMES[pc] : ""}</button>`; });

  }
  function octaveFor() {

    return mode === "wide" ? pick([3, 4, 5]) : 4;
  }
  async function newQ() {
    if (busy) return; busy = true;
    const u = unlocked(); let pc;
    do { pc = weightedPick(u, N, NOTE_ORDER[N.unlocked - 1]); } while (cur && pc === cur.pc && u.length > 2 && Math.random() < 0.6);
    cur = { pc, midi: 12 * (octaveFor() + 1) + pc };

  async function playCur(withScramble) {

    if (canUnlock(N)) {

  }
  // Practice: tapping keys before starting lets you hear each note
  buildPiano(); segs();
  $piano.querySelectorAll("button:not(.locked)").forEach(b => b.onclick = () => { if (!cur) playMidi(60 + +b.dataset.pc); else answer(+b.dataset.pc, b); });

  document.onkeydown = e => { if (e.code === "Space") { e.preventDefault(); $play.click(); } };
};

const VOICES = {
  deep: { label: "Deep", lo: 41, hi: 53, desc: "F2–F3 · lower or changed voices" },
  mid:  { label: "Middle", lo: 48, hi: 60, desc: "C3–C4" },
  high: { label: "High", lo: 57, hi: 69, desc: "A3–A4 · higher voices" },

// Autocorrelation pitch detector (returns Hz or -1)
function detectPitch(buf, sr) {
  let n = buf.length, rms = 0;
  for (let i = 0; i < n; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / n); if (rms < 0.012) return -1;

  const len = n - maxLag;

  const d = new Float32Array(maxLag + 1);
  for (let lag = 1; lag <= maxLag; lag++) {
    let s = 0; for (let i = 0; i < len; i++) { const x = buf[i] - buf[i + lag]; s += x * x; } d[lag] = s;
  }
  let run = 0; const cm = new Float32Array(maxLag + 1); cm[0] = 1;
  for (let lag = 1; lag <= maxLag; lag++) { run += d[lag]; cm[lag] = run ? d[lag] * lag / run : 1; }
  let tau = -1;
  for (let lag = minLag; lag <= maxLag; lag++) {
    if (cm[lag] < 0.15) { while (lag + 1 <= maxLag && cm[lag + 1] < cm[lag]) lag++; tau = lag; break; }
  }
  if (tau < 0) return -1;
  const a = cm[tau - 1] ?? cm[tau], b = cm[tau], c = cm[tau + 1] ?? cm[tau];
  const den = a + c - 2 * b; const shift = den ? (a - c) / (2 * den) : 0;
  return sr / (tau + shift);
}

        `You tapped <b>${Math.round(tapped)} BPM</b> <span class="hint">(${dirTxt})</span><br>` +
        `<span class="hint">Steadiness: ${steady}%${steady < 70 ? ". Try to keep every gap the same" : ""}</span>`;
      document.getElementById("after").innerHTML = `<button class="btn ghost" id="ha">🔊 Hear ${target}</button><button class="btn" id="nx">${r < ROUNDS ? "Next →" : "See score"}</button>`;
      document.getElementById("ha").onclick = () => playBeats(target, 8);
      document.getElementById("nx").onclick = () => { stopBeats(); r < ROUNDS ? q() : end(); };
    }
    function end() {
      T.tapRounds++; const best = stars > T.tapBest; if (best) T.tapBest = stars; save();
      $tp.innerHTML = `
        <div class="stage">
          <div style="color:var(--muted)">Tap the BPM: score</div>
          <div class="tnote">${stars}<small> / ${ROUNDS * 3} ⭐</small></div>
          <div>${results.map(x => `<span class="chip" style="margin:3px">${x.target}: you ${x.tapped} ${"⭐".repeat(x.s) || "–"}</span>`).join("")}</div>
          ${best ? `<div style="color:var(--good);font-weight:700">🏅 New best!</div>` : `<div class="hint">Your best: ${T.tapBest} ⭐</div>`}
          <div class="hint">⭐⭐⭐ within 3% · ⭐⭐ within 6% · ⭐ within 10% · lose a star if steadiness is under 70%</div>
          <button class="btn big" id="again">Play again</button>
        </div>`;
      document.getElementById("again").onclick = () => tapGame();
    }
    q();
  }

  segs(); start();
  cleanup = reset;
};

/* ================= Boot ================= */
load();
if (store.current && store.players[store.current]) go(screens.home); else go(screens.players);
</script>
</body>
</html>
